# Mapping of the categories of Open Food/Beauty/Products/Pet Food Facts to the
# fine classes (mapping/classes.yaml). The app's item group follows from them.
#
# Rules (implemented in src/pgm/categories.py):
# - All ancestors from the taxonomy are added to the categories of a product.
# - Of the mapped categories, only the most specific count, i.e. those below
#   which no other mapped category of the product lies.
# - ~class: weak mapping for broad categories. It only counts if there is no
#   strong mapping among the most specific categories (like "~" in the app's
#   dictionary): jam is fruit (~obst) and spread (aufstriche) → aufstriche.
# - +class: preferred, beats normal and weak entries. Only for cases where two
#   branches of the taxonomy are equally specific and no common subcategory
#   exists (plant-based cream lies under plant-based drinks).
# - If the remaining categories lead to different classes, the product is
#   dropped (conflict). Resolve with an entry for the more specific category.
# - null: deliberately ignore the category (cross-cutting like "frozen" or
#   "organic", or too broad). It counts neither as a match nor as a conflict.
# - _drop: drop the product entirely (misclassified or unusable entries).
# - _default: class for products of the source without a mappable category.
#
# By content, not by storage form: frozen peas and canned peas are vegetables.
# Doubtful cases are commented with "?".

