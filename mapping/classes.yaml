    examples: [KNUSPERMUESLI, HAFERFLOCKEN, CORNFLAKES, PORRIDGE]
  - id: backzutaten
    group: pantry
    name: Flour, sugar, baking ingredients
    note: also yeast, baking powder, baking mixes, gelatine
    examples: [WEIZENMEHL 405, ZUCKER 1KG, TROCKENHEFE, BACKPULVER]
  - id: oel_essig
    group: pantry
    name: Oil and vinegar
    examples: [OLIVENOEL, SONNENBLUMENOEL, BALSAMICO]
  - id: gewuerze_saucen
    group: pantry
    name: Spices, sauces, stock
    note: also ketchup, mustard, mayonnaise, pesto, tomato paste, passata
    examples: [KETCHUP, SENF MITTELSCHARF, GEMUESEBRUEHE, PESTO GENOVESE]
  - id: huelsenfruechte
    group: pantry
    name: Pulses
    note: lentils, chickpeas, beans (dried or canned); green peas see gemuese
    examples: [ROTE LINSEN, KICHERERBSEN, KIDNEYBOHNEN]
  - id: nuesse_trockenobst
    group: pantry
    name: Nuts, seeds, dried fruit
    note: for baking and cooking; salted and roasted see knabbereien
    examples: [MANDELN GEMAHLEN, WALNUSSKERNE, LEINSAMEN, ROSINEN]
  - id: aufstriche
    group: pantry
    name: Spreads
    note: jam, honey, nut butter, nut nougat, vegan spreads
    examples: [ERDBEER KONFITUERE, BLUETENHONIG, NUTELLA, ERDNUSSBUTTER]
  - id: sportnahrung
    group: pantry  # ? or drugstore
    name: Sports nutrition
    note: protein powder, protein bars, shakes; supplements see gesundheit
