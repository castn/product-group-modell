# Fine classes of the model and their item group in the app (mapping/groups.yaml).
#
# The model learns these classes; the app shows the group. The mapping class →
# group can be changed without retraining. A class can later become a group of
# its own in the app.
#
# Criteria for a class:
# - What is in it really belongs together.
# - A human recognizes the class from the line on the receipt. Hence no classes
#   by storage form (canned, frozen): "ERBSEN 400G" does not reveal that.
# - By content, like the app's ItemGroup: frozen peas and canned peas are vegetables.
# - Enough examples in Open Food Facts (rule of thumb: a few hundred), otherwise
#   merge with a neighbouring class.
#
# examples: hand-written lines in receipt style, as a guide when labelling the
# test data (not taken from the test data).

classes:
  # --- produce ---------------------------------------------------------------
  - id: obst
    group: produce
    name: Fruit
    note: fresh, frozen or canned; dried fruit see nuesse_trockenobst
    examples: [BANANEN, "ÄPFEL ELSTAR", TK HIMBEEREN, ANANAS STUECKE]
  - id: gemuese
    group: produce
    name: Vegetables, potatoes, salad, herbs, mushrooms
    note: also canned, frozen and creamed spinach; pickled see feinkost
    examples: [ZWIEBELN 1KG, TOMATEN RISPE, JA ERBSEN, RAHMSPINAT, CHAMPIGNONS]

  # --- bakery ----------------------------------------------------------------
  - id: brot
    group: bakery
    name: Bread, rolls, toast
    note: also bake-at-home rolls, crispbread, wraps
    examples: [ROGGENMISCHBROT, BRÖTCHEN, BUTTERTOAST, LAUGENBREZEL]
  - id: kuchen_gebaeck
    group: bakery
    name: Cakes and pastries
    note: cakes, pastries, croissants, stollen; packaged biscuits see kekse_riegel
    examples: [APFELSTRUDEL, CROISSANT, MARMORKUCHEN, BERLINER]

  # --- dairy -----------------------------------------------------------------
  - id: milch_sahne
    group: dairy
    name: Milk, cream, buttermilk
    examples: [H-MILCH 3,5%, SCHLAGSAHNE, BUTTERMILCH, KAFFEESAHNE]
  - id: joghurt_quark
    group: dairy
    name: Yoghurt, quark, pudding
    note: also skyr, kefir, rice pudding, dairy desserts
    examples: [NATURJOGHURT, MAGERQUARK, SKYR VANILLE, SCHOKOPUDDING]
  - id: kaese
    group: dairy
    name: Cheese
    note: also cream cheese, grilling cheese, feta
    examples: [GOUDA JUNG, MOZZARELLA, FRISCHKAESE NATUR, HALLOUMI]
  - id: butter_fette
    group: dairy
    name: Butter, margarine
    examples: [DEUTSCHE MARKENBUTTER, RAMA, BUTTERSCHMALZ]
  - id: eier
    group: dairy
    name: Eggs
    examples: [EIER M 10ER, FREILAND EIER]
  - id: pflanzendrinks
    group: dairy  # ? or drinks, or a group of its own in the app
    name: Plant-based drinks
    examples: [HAFER DRINK, OATLY BARISTA, SOJA DRINK, MANDELDRINK]
  - id: pflanzl_milchalternativen
    group: dairy
    name: Plant-based alternatives to yoghurt, cheese, cream
    examples: [SOJAJOGHURT, VEGANER REIBEKAESE, HAFER CUISINE]

  # --- meat_fish -------------------------------------------------------------
  - id: fleisch
    group: meat_fish
    name: Meat and poultry
    note: fresh, minced meat, schnitzel, also breaded
    examples: [HAEHNCHENBRUSTFILET, HACKFLEISCH GEM., SCHWEINESCHNITZEL]
  - id: wurst_aufschnitt
    group: meat_fish
    name: Sausage, ham, cold cuts
    examples: [SALAMI, KOCHSCHINKEN, WIENER WUERSTCHEN, LEBERWURST]
  - id: fisch
    group: meat_fish
    name: Fish and seafood
    note: also canned fish, smoked salmon, fish fingers
    examples: [LACHSFILET, THUNFISCH NATUR, FISCHSTAEBCHEN, GARNELEN]
  - id: tofu_fleischalternativen
    group: meat_fish  # ? or a group of its own in the app
    name: Tofu and meat alternatives
    note: tofu, tempeh, seitan, veggie burgers, vegan sausage; falafel see feinkost
    examples: [TOFU NATUR, VEGGIE BURGER, RUEGENW. VEG. SALAMI, SEITAN]

  # --- pantry ----------------------------------------------------------------
  - id: nudeln_reis
    group: pantry
    name: Pasta, rice, grains
    note: also couscous, bulgur, quinoa; filled pasta see fertiggerichte
    examples: [SPAGHETTI, BASMATI REIS, COUSCOUS, FUSILLI]
  - id: muesli_flocken
