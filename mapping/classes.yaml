  - id: feinkost
    group: ready_meals
    name: Delicatessen, salads, dips
    note: hummus, falafel, potato salad, tzatziki, antipasti, olives, pickled gherkins
    examples: [HUMMUS NATUR, KARTOFFELSALAT, FALAFEL, GEWUERZGURKEN]

  # --- sweets_snacks ---------------------------------------------------------
  - id: suesswaren
    group: sweets_snacks
    name: Chocolate and confectionery
    note: sweets, fruit gums, pralines, marzipan, chewing gum
