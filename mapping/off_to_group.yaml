# Mapping of the categories of Open Food/Beauty/Products Facts to the item groups
# of the app (mapping/groups.yaml).
#
# Rules (implemented in src/pgm/categories.py):
# - All ancestors from the taxonomy are added to the categories of a product.
# - Of the mapped categories, only the most specific count, i.e. those below
#   which no other mapped category of the product lies.
# - If these lead to different groups, the product is dropped (conflict).
#   Resolve by adding the common, more specific category.
# - ~group: weak mapping for broad categories. It only counts if there is no
#   strong mapping among the most specific categories (like "~" in the app's
#   dictionary): jam is fruit (~produce) and jam (pantry) → pantry.
# - null: deliberately ignore the category (cross-cutting like "frozen" or
#   "organic", or too broad). It counts neither as a match nor as a conflict.
# - _drop: drop the product entirely (misclassified or unusable entries).
# - _default: group for products of the source without a mappable category.
#
# Guideline as in the app: groups by content, not by storage
# (frozen peas → produce). Doubtful cases are commented with "?".

