# Publishes the download index models.json on GitHub Pages (docs/interface.md#download-index).
#
# Runs when a model release is published, edited (e.g. marked as pre-release for a
# rollback), unpublished or deleted, and by hand. The index is always built from all
# releases with the script from the default branch, so the event itself does not matter.
#
# Once in the repository settings: Pages → Source "GitHub Actions", custom domain there.

name: Model index

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'model-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build models.json from the releases
        run: python3 -I scripts/model_index.py --repo "$GITHUB_REPOSITORY" --out site/models.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cat site/models.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}models.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
